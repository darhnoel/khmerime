name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release candidate tag, for example v1.0.0-rc.1"
        required: true
        type: string
      create_draft:
        description: "Create or update a draft GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          KHMERIME_PACKAGE_VERSION="$version" make linux-package

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/*.deb
          if-no-files-found: error

  windows-msi:
    name: Windows .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.0
          wix --version

      - name: Build Windows MSI
        shell: pwsh
        run: |
          $artifactVersion = "${{ inputs.tag }}" -replace '^v', ''
          $productVersion = ($artifactVersion -split "[-+]")[0]
          $env:KHMERIME_PACKAGE_VERSION = $artifactVersion
          $env:KHMERIME_WINDOWS_PRODUCT_VERSION = $productVersion
          ./scripts/platforms/windows/tsf/build_msi.ps1

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/windows/*.msi
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs:
      - linux-deb
      - windows-msi
    runs-on: ubuntu-latest
    if: inputs.create_draft
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-assets -maxdepth 3 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" release/
          done
          cd release
          sha256sum * > SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="KhmerIME ${TAG#v}"
          notes="Draft release candidate for ${title}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes "$notes"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --title "$title" --notes "$notes"
          fi
