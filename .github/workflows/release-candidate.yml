name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release candidate tag, for example v1.0.0-rc.1"
        required: true
        type: string
      create_draft:
        description: "Create or update a draft GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          deb_version="${version/-rc./~rc.}"
          if [[ "$deb_version" != *-* ]]; then
            deb_version="${deb_version}-1"
          fi
          KHMERIME_PACKAGE_VERSION="$deb_version" make linux-package

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/*.deb
          if-no-files-found: error

  windows-msi:
    name: Windows .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.0
          wix --version

      - name: Build Windows MSI
        shell: pwsh
        run: |
          $artifactVersion = "${{ inputs.tag }}" -replace '^v', ''
          $productVersion = ($artifactVersion -split "[-+]")[0]
          $env:KHMERIME_PACKAGE_VERSION = $artifactVersion
          $env:KHMERIME_WINDOWS_PRODUCT_VERSION = $productVersion
          ./scripts/platforms/windows/tsf/build_msi.ps1

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/windows/*.msi
          if-no-files-found: error

  android-aab:
    name: Android .aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android App Bundle
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          KHMERIME_PACKAGE_VERSION="$version" make android-package

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: dist/android/*.aab
          if-no-files-found: error

  macos-pkg:
    name: macOS .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build macOS package
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          KHMERIME_PACKAGE_VERSION="$version" make macos-package

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/macos/*.pkg
          if-no-files-found: error

  ios-archive:
    name: iOS .xcarchive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build iOS archive
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          KHMERIME_PACKAGE_VERSION="$version" make ios-package

      - name: Zip iOS archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag }}"
          version="${version#v}"
          cd dist/ios
          ditto -c -k --keepParent "KhmerIME-${version}-ios.xcarchive" "KhmerIME-${version}-ios.xcarchive.zip"

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: dist/ios/*.xcarchive.zip
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs:
      - linux-deb
      - windows-msi
      - android-aab
      - macos-pkg
      - ios-archive
    runs-on: ubuntu-latest
    if: inputs.create_draft
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-assets -maxdepth 3 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" release/
          done
          cd release
          sha256sum * > SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          title="KhmerIME ${version}"
          deb_version="${version/-rc./~rc.}"
          if [[ "$deb_version" != *-* ]]; then
            deb_version="${deb_version}-1"
          fi
          notes="Draft release candidate for ${title}.

Artifacts are unsigned unless the filename or store pipeline says otherwise.
Linux Debian package version: ${deb_version}."

          edit_flags=(--title "$title" --notes "$notes")
          create_flags=(--draft --title "$title" --notes "$notes")
          if [[ "$TAG" == *-rc.* ]]; then
            edit_flags+=(--prerelease)
            create_flags+=(--prerelease --latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${edit_flags[@]}"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${create_flags[@]}"
          fi
