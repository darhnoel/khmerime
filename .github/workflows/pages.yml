name: Publish site to GitHub Pages

# Builds and publishes site/download/ — the download landing page and the privacy policy the
# App Store and Play Console require a public URL for.
#
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/download/**"
      - "scripts/web/build_download_page.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The page is a template (@VERSION@, @WINDOWS_URL@, ...); build it first.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the download page
        run: python3 scripts/web/build_download_page.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/download-page

      - id: deployment
        uses: actions/deploy-pages@v4
