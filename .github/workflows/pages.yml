name: Publish site to GitHub Pages

# Publishes site/download/ — the download landing page and the privacy policy the
# App Store and Play Console require a public URL for.
#
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/download/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/download

      - id: deployment
        uses: actions/deploy-pages@v4
