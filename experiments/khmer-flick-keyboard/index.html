<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7f9" />
<title>Khmer Directional Lean Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --ink: #111318;
    --muted: #70747c;
    --accent: #1677ff;
    --keyboard: #d4d7dc;
    --key: #fbfbfc;
    --key-special: #aeb3bb;
    --key-shadow: #858a92;
    --pressed: #c5c9cf;
    --gap: 3px;
    --page: #f6f7f9;
    --surface: #fff;
    --composer-end: #fbfbfc;
    --border: #eceef1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Kantumruy Pro", "Noto Sans Khmer", system-ui, sans-serif;
    color: var(--ink);
    background: var(--page);
  }

  .app-bar,
  .keyboard-shell,
  #popup {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  body { display: flex; justify-content: center; }

  .phone {
    width: 100%;
    max-width: 520px;
    min-width: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: 0 0 36px rgb(18 25 38 / 8%);
  }

  .app-bar {
    min-height: 54px;
    padding: max(10px, env(safe-area-inset-top)) 16px 9px;
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    font-family: system-ui, sans-serif;
  }

  .app-bar button {
    appearance: none;
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: 500 16px/28px system-ui, sans-serif;
  }

  .app-bar .back { text-align: left; font-size: 25px; line-height: 28px; }
  .app-title { min-width: 0; text-align: center; }
  .app-title strong { display: block; font: 600 16px/20px "Kantumruy Pro", system-ui, sans-serif; }
  .app-title span {
    display: block;
    overflow: hidden;
    color: var(--muted);
    font: 12px/15px system-ui, sans-serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-actions { display: flex; align-items: center; gap: 5px; }
  .app-bar .done {
    min-width: 48px;
    font-family: "Kantumruy Pro", system-ui, sans-serif;
    text-align: right;
  }

  .app-bar .display-toggle {
    width: 32px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    border: 1px solid #c9cdd3;
    border-radius: 9px;
    color: var(--muted);
    font: 600 17px/30px system-ui, sans-serif;
    text-align: center;
  }

  .app-bar .display-toggle[aria-checked="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .composer {
    flex: 1 1 auto;
    min-height: 0;
    padding: 20px 18px;
    overflow-y: auto;
    background: linear-gradient(var(--surface), var(--composer-end));
    touch-action: auto;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }

  .display-toggle {
    appearance: none;
    min-height: 32px;
    padding: 4px 11px;
    border: 1px solid #c9cdd3;
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: 600 13px/20px system-ui, sans-serif;
  }

  .display-toggle[aria-checked="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  #output {
    min-height: 92px;
    padding-top: 16px;
    font-size: clamp(23px, 6.3vw, 30px);
    line-height: 1.65;
    word-break: break-word;
    white-space: pre-wrap;
    cursor: text;
    touch-action: auto;
    user-select: text;
    -webkit-user-select: text;
  }

  #output::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1.25em;
    margin-left: 2px;
    vertical-align: -.24em;
    border-radius: 1px;
    background: var(--accent);
    animation: blink 1.05s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Composing preedit: underlined, not yet committed to the document. */
  #preedit {
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
    color: var(--accent);
  }

  .keyboard-shell {
    flex: 0 0 auto;
    background: var(--keyboard);
    border-top: 1px solid #c4c7cc;
    padding-bottom: env(safe-area-inset-bottom);
    font-family: "Kantumruy Pro", "Noto Sans Khmer", system-ui, sans-serif;
  }

  #suggestions {
    height: 32px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: center;
    padding: 2px 6px;
    border-bottom: 1px solid rgb(100 105 113 / 24%);
    overflow: hidden;
  }

  #suggestions .sug {
    appearance: none;
    min-width: 0;
    height: 27px;
    padding: 1px 8px;
    overflow: hidden;
    border: 0;
    border-right: 1px solid rgb(100 105 113 / 25%);
    background: transparent;
    color: #202329;
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    line-height: 24px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #suggestions .sug:last-child { border-right: 0; }
  #suggestions .sug:active { color: var(--accent); background: rgb(255 255 255 / 36%); }
  #suggestions .sug.placeholder { color: #696d74; font-size: 14px; }

  .kb {
    padding: 3px 4px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .kb-row { display: flex; gap: var(--gap); }

  .key,
  .action {
    position: relative;
    min-width: 0;
    appearance: none;
    border: 0;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    -webkit-touch-callout: none;
  }

  .key {
    --heat: 0;   /* 0..1 next-key probability, set by the bigram heatmap */
    position: relative;
    flex: 1 1 0;
    height: clamp(38px, 9.5vw, 44px);
    height: clamp(38px, calc((33dvh - 90px) / 4), 44px);
    min-width: 0;
    overflow: hidden;
    border-radius: 6px;
    background: var(--key);
    box-shadow: 0 1px 0 1px var(--key-shadow), 0 2px 1px rgb(33 38 45 / 18%);
    font-family: inherit;
    font-size: clamp(18px, 4.7vw, 21px);
    font-weight: 500;
    line-height: 1;
    transition: height 140ms ease, transform 50ms ease, background 50ms ease, box-shadow 50ms ease;
    touch-action: none;
  }

  /* Bigram heat: a colored ring on likely-next keys, blue (cold) → red (hot).
     --heat-color is set per key in JS; --heat is 0..1 for the glow strength.
     Inset so it stays within the key's clipped, rounded bounds. */
  .key::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--heat-color, transparent);
    opacity: var(--heat, 0);
    transition: opacity 120ms ease;
  }

  .key .member {
    position: relative;
    z-index: 0;
    isolation: isolate;
  }

  .key .member::after {
    content: "";
    position: absolute;
    z-index: -1;
    width: 1.6em;
    aspect-ratio: 1;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--member-heat-color, transparent) 0 32%, transparent 72%);
    opacity: calc(var(--member-heat, 0) * .34);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: opacity 120ms ease;
  }

  .key.is-pressed {
    z-index: 2;
    background: var(--pressed);
    box-shadow: 0 1px 0 var(--key-shadow);
    transform: translateY(1px);
  }

  body.heat-off .key::after { opacity: 0 !important; }
  body.heat-off .key .member::after { opacity: 0 !important; }
  body.center-only { --gap: 3px; }
  body.center-only .kb { padding-top: 3px; }
  body.center-only .key { height: clamp(32px, 8.5vw, 36px); }
  body.center-only .key .hint { opacity: 0; }
  body.center-only .action { height: 34px; }

  body.full-height { --gap: clamp(5px, 1.7vw, 8px); }
  body.full-height .kb { padding: 7px 5px 5px; }
  body.full-height .key {
    height: clamp(64px, 18vw, 74px);
    font-size: 26px;
  }
  body.full-height .key .hint {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.3;
    opacity: 1;
  }
  body.full-height .hint.u { top: 5px; }
  body.full-height .hint.d { bottom: 5px; }
  body.full-height .hint.l { left: 5px; }
  body.full-height .hint.r { right: 5px; }
  body.full-height.center-only { --gap: clamp(4px, 1.2vw, 6px); }
  body.full-height.center-only .key { height: clamp(48px, 13vw, 56px); }
  body.full-height.center-only .key .hint { opacity: 0; }

  body.night {
    --ink: #f2f4f7;
    --muted: #aeb4bd;
    --accent: #5aa2ff;
    --keyboard: #252930;
    --key: #3b4048;
    --key-special: #4b515b;
    --key-shadow: #171a1f;
    --pressed: #555c66;
    --page: #101216;
    --surface: #181b20;
    --composer-end: #15181d;
    --border: #30343b;
  }

  body.night .phone { box-shadow: 0 0 36px rgb(0 0 0 / 35%); }
  body.night .keyboard-shell { border-top-color: #15181d; }
  body.night .key .hint { color: #c9ced6; }
  body.night #suggestions .sug { color: #eef1f5; }
  body.night .app-bar .display-toggle { border-color: #555b65; }
  body.night .app-bar .display-toggle[aria-checked="true"] { border-color: var(--accent); }
  body.night .action.space { background: #363b43; }

  .key .center { pointer-events: none; }
  .key .hint {
    position: absolute;
    color: #3d4148;
    font-family: inherit;
    font-size: clamp(9px, 2.5vw, 11px);
    font-weight: 500;
    line-height: 1.15;
    white-space: nowrap;
    pointer-events: none;
  }


  .hint.u,
  .hint.d {
    left: 25%;
    width: 50%;
    text-align: center;
  }

  .hint.l,
  .hint.r {
    top: 50%;
    width: 27%;
    overflow: visible;
    transform: translateY(-50%);
  }

  .hint.u { top: 2px; }
  .hint.d { bottom: 2px; }
  .hint.l { left: 3px; text-align: left; }
  .hint.r { right: 3px; text-align: right; }

  .actions { align-items: stretch; }
  .action {
    height: 36px;
    border-radius: 6px;
    background: var(--key-special);
    box-shadow: 0 1px 0 1px #7e838b, 0 2px 1px rgb(33 38 45 / 14%);
    font: 500 13px/1 "Kantumruy Pro", system-ui, sans-serif;
  }

  .action:active { background: #989da5; transform: translateY(1px); box-shadow: 0 1px 0 #757a82; }
  .action.icon { flex: 0 0 clamp(42px, 12vw, 54px); font-size: 18px; }
  .action.mode { flex: 0 0 clamp(48px, 14vw, 62px); }
  .action.space { flex: 1 1 auto; background: var(--key); }
  .action.return { flex: 0 0 clamp(58px, 17vw, 76px); font-size: 12px; }

  #popup {
    position: fixed;
    z-index: 50;
    display: none;
    width: 132px;
    height: 108px;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgb(18 25 38 / 22%));
  }

  #popup .preview-family {
    position: relative;
    width: 132px;
    height: 108px;
    border: 1px solid rgb(90 96 106 / 45%);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-family: "Kantumruy Pro", "Noto Sans Khmer", system-ui, sans-serif;
    font-weight: 500;
    line-height: 1;
  }

  #popup .preview-member {
    position: absolute;
    min-width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 21px;
  }

  #popup .preview-member[hidden] { display: none; }

  #popup .preview-member.c { left: 49px; top: 37px; font-size: 28px; }
  #popup .preview-member.u { left: 49px; top: 2px; }
  #popup .preview-member.d { left: 49px; bottom: 2px; }
  #popup .preview-member.l { left: 7px; top: 37px; }
  #popup .preview-member.r { right: 7px; top: 37px; }
  #popup .preview-member.is-selected {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 1px #0f61ca;
  }

  @media (max-width: 430px) {
    .app-bar {
      padding-inline: 8px;
      grid-template-columns: 28px minmax(0, 1fr) max-content;
      gap: 4px;
    }
    .header-actions { min-width: max-content; gap: 3px; }
    .header-actions > * { flex: 0 0 auto; }
    .app-bar .display-toggle { width: 28px; height: 28px; min-height: 28px; font-size: 15px; line-height: 26px; }
    .app-bar .done { min-width: 40px; font-size: 14px; }
  }

  @media (max-width: 380px) {
    .app-title span { display: none; }
    .key .hint { font-weight: 400; opacity: .68; }
  }

  @media (max-width: 340px) {
    .key .hint { opacity: 0; }
  }

  @media (min-width: 521px) {
    body { padding-block: 18px; background: #e8eaee; }
    .phone { min-height: calc(100% - 36px); border-radius: 20px; overflow: hidden; }
  }

  @media (max-width: 430px) and (max-height: 620px) {
    .app-bar {
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      grid-template-rows: 28px 28px;
      padding-block: max(6px, env(safe-area-inset-top)) 5px;
      row-gap: 3px;
    }
    .app-bar .back { grid-column: 1; grid-row: 1; }
    .app-title { grid-column: 2; grid-row: 1; }
    .header-actions {
      grid-column: 1 / -1;
      grid-row: 2;
      justify-self: center;
    }
  }

  @media (max-height: 620px) {
    .composer { padding-block: 10px; }
    #output { min-height: 48px; padding-top: 10px; }
    #suggestions { height: 30px; }
    .kb { padding-top: 3px; }
    .key { height: 38px; font-size: 18px; }
    .key .hint { font-size: 9px; }
    .action { height: 34px; }
    body.center-only .key { height: 32px; }
    body.center-only .action { height: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #output::after { animation: none; }
  }
</style>
</head>
<body>
  <main class="phone">
    <header class="app-bar">
      <button class="back" type="button" aria-label="Back">‹</button>
      <div class="app-title">
        <strong>សារថ្មី</strong>
        <span>Khmer Directional Lean</span>
      </div>
      <div class="header-actions">
        <button class="display-toggle" id="night-toggle" type="button" role="switch" aria-checked="false" aria-label="Night mode" title="Night mode">☾</button>
        <button class="display-toggle" id="heat-toggle" type="button" role="switch" aria-checked="true" aria-label="Heatmap" title="Heatmap">◉</button>
        <button class="display-toggle" id="center-toggle" type="button" role="switch" aria-checked="false" aria-label="Centre characters only" title="Centre characters only">ក</button>
        <button class="display-toggle" id="height-toggle" type="button" role="switch" aria-checked="false" aria-label="Full-height keys" title="Full-height keys">↕</button>
        <button class="display-toggle" id="layout-toggle" type="button" role="switch" aria-checked="false" aria-label="Use យ and ត as family centres" title="Layout B: យ and ត centres">យត</button>
        <button class="done" id="copy-output" type="button">ចម្លង</button>
      </div>
    </header>

    <section class="composer" aria-label="Message composer">
      <div id="output" role="textbox" aria-multiline="true" aria-readonly="true" aria-label="Typed text" tabindex="0"><span id="committed"></span><span id="preedit"></span></div>
    </section>

    <section class="keyboard-shell" aria-label="Khmer directional lean keyboard">
      <div id="suggestions" aria-label="Word suggestions"></div>
      <div class="kb" id="kb"></div>
    </section>
  </main>

  <div id="popup" aria-hidden="true">
    <div class="preview-family">
      <span class="preview-member c"></span>
      <span class="preview-member u"></span>
      <span class="preview-member l"></span>
      <span class="preview-member r"></span>
      <span class="preview-member d"></span>
    </div>
  </div>

  <script src="keymap.js?v=17"></script>
  <script src="ngram.js?v=16"></script>
  <script src="words.js?v=16"></script>
  <script src="keyboard.js?v=36"></script>
</body>
</html>
