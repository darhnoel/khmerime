<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static Silk Veil theme harness: the real app stylesheet, no WASM build.
         Representative markup is added here only as tests require it. -->
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <div class="shell">
      <div class="editor-card">
        <div class="editor-wrap">
          <div class="composition-preview composition-preview-segmented">
            <span class="composition-preview-text">ធ្វើ</span>
            <span class="composition-caret" aria-hidden="true"></span>
          </div>
        </div>
        <div class="suggestion-popup">
          <div class="candidate-track candidate-track-popup">
            <ul class="suggestion-list candidate-list">
              <li class="suggestion active">
                <button type="button">
                  <span class="suggestion-rank">1</span>
                  <span class="suggestion-main">
                    <span class="suggestion-word">ធ្វើ</span>
                    <span class="suggestion-roman-hint">tver</span>
                    <span class="suggestion-recommended">គួរប្រើ</span>
                  </span>
                </button>
              </li>
              <li class="suggestion">
                <button type="button">
                  <span class="suggestion-rank">2</span>
                  <span class="suggestion-main">
                    <span class="suggestion-word">ធ្វេី</span>
                  </span>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
