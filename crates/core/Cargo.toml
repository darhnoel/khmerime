[package]
name = "khmerime_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
wfst-decoder = []
fetch-data = []
no-search-index = []
# Optional model span-proposal provider. Off by default so other platforms stay model-free.
model-provider = ["dep:candle-core", "dep:candle-nn", "dep:serde_json", "dep:serde_plain", "dep:tracing", "dep:anyhow"]

[dependencies]
khmerime_config = { path = "../khmerime_config" }
serde = { version = "1", features = ["derive"] }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
serde_plain = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode = { version = "1.3" }
blake3 = { version = "1.5", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console", "Performance", "Window"] }
wasm-bindgen-futures = "0.4"
