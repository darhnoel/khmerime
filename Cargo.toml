[workspace]
members = [
  ".",
  "crates/core",
  "crates/khmerime_config",
  "crates/session",
  "adapters/linux-ibus",
  "adapters/macos-imk",
  "adapters/windows-tsf",
  "adapters/ios-keyboard",
  "adapters/android-ime",
  "apps/dioxus-app",
  "apps/lookup-cli",
]
default-members = [
  ".",
  "crates/core",
  "crates/session",
  "adapters/linux-ibus",
  "apps/dioxus-app",
  "apps/lookup-cli",
]
resolver = "2"

[package]
name = "roman_lookup"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
wfst-decoder = ["khmerime_core/wfst-decoder"]
fetch-data = ["khmerime_core/fetch-data"]
cli = []

[dependencies]
khmerime_core = { path = "crates/core" }
khmerime_session = { path = "crates/session" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false

# Engine construction (ranked lexicon indexing, search index building) is
# arithmetic-heavy and runs ~10-20x slower unoptimized. Debug dev builds are what
# the Windows TSF dev loop registers (`make platform-reinstall-windows`), so an
# unoptimized khmerime_core made cold start look like a ~4.7s adapter problem when
# most of it was the missing optimizer. Adapter crates stay at opt-level 0 so they
# remain debuggable; only the engine and third-party deps are optimized.
[profile.dev.package.khmerime_core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
