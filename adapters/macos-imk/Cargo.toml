[package]
name = "khmerime_macos_imk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
khmerime_core    = { path = "../../crates/core" }
khmerime_session = { path = "../../crates/session" }
uniffi = { version = "0.31", features = ["cli"] }
