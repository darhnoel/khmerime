name: KhmerIME
options:
  bundleIdPrefix: com.khmerime
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Signing: use "-" for ad-hoc (no Apple account needed, simulator only).
    # Replace with your 10-char DEVELOPMENT_TEAM ID for device builds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:

  KhmerIME:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME
        INFOPLIST_FILE: KhmerIME/Info.plist
    dependencies:
      - target: KhmerIMEKeyboard
        embed: true

  KhmerIMEKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIMEKeyboard
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME.Keyboard
        INFOPLIST_FILE: KhmerIMEKeyboard/Info.plist
    dependencies:
      - framework: Frameworks/KhmerIME.xcframework
        embed: false
