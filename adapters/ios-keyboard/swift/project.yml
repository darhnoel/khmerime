name: KhmerIME
options:
  bundleIdPrefix: com.khmerime
  developmentLanguage: km
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # iPhone only (1). Left unset, Xcode targets iPhone *and* iPad, which makes the
    # App Store demand iPad screenshots and review the app on a device the keyboard
    # layout has never been tested against. Raise to "1,2" when iPad is deliberately
    # supported and verified.
    TARGETED_DEVICE_FAMILY: "1"
    # Version comes from the repo's Product Version, never a hardcoded plist value —
    # the app and the keyboard extension must agree or App Store Connect rejects the
    # upload. Both Info.plists read these via $(MARKETING_VERSION) /
    # $(CURRENT_PROJECT_VERSION); release builds override them on the xcodebuild
    # command line (see scripts/platforms/ios/keyboard/build_archive.sh), so these
    # defaults only apply to local dev builds.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "9289LTXAT7"
    # Xcode 26 ships Debug code in a separate .debug.dylib with a stub executable.
    # Such builds install as unlaunchable "placeholders" outside Xcode's own run
    # path (simctl install, and even Run here) — "Application failed preflight
    # checks". Disable it so every target builds a single normal executable.
    ENABLE_DEBUG_DYLIB: "NO"

schemes:
  KhmerIME:
    build:
      targets:
        KhmerIME: all

  KhmerIMEKeyboard:
    build:
      targets:
        KhmerIMEKeyboard: all

  KhmerIMEKeyboardTests:
    build:
      targets:
        KhmerIMEKeyboard: all
        KhmerIMEKeyboardTests: test
    test:
      targets:
        - KhmerIMEKeyboardTests

targets:

  KhmerIME:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIME
      # Shared with the keyboard extension: the app's Settings toggle writes this preference; the
      # extension reads it. Both compile the same source; the App Group makes the value shared.
      - path: KhmerIMEKeyboard/Input/SmartModePreference.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME
        # Must be set per-target: xcodegen writes its own "1,2" default onto every
        # iOS target, and a target-level value overrides settings.base.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: KhmerIME/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Group so the host-app Settings toggle and the keyboard extension share the Smart-mode
        # preference (UserDefaults suite group.com.khmerime). Kept in project.yml so xcodegen regen
        # doesn't drop the capability.
        CODE_SIGN_ENTITLEMENTS: KhmerIME/KhmerIME.entitlements
    dependencies:
      - target: KhmerIMEKeyboard
        embed: true

  KhmerIMEKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIMEKeyboard
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME.Keyboard
        # The appex must match the container app's device family, or the App Store
        # rejects the pair as inconsistent.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: KhmerIMEKeyboard/Info.plist
        # Same App Group as the host app — the extension reads the shared Smart-mode preference.
        CODE_SIGN_ENTITLEMENTS: KhmerIMEKeyboard/KhmerIMEKeyboard.entitlements
    dependencies:
      - framework: Frameworks/KhmerIME.xcframework
        embed: false

  KhmerIMEKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIMEKeyboardTests
      # Share the handler + session source directly (no linking the extension bundle).
      - path: KhmerIMEKeyboard/Input/KeyboardDispatcher.swift
      - path: KhmerIMEKeyboard/Input/KeyboardInputHandler.swift
      - path: KhmerIMEKeyboard/Input/KeyboardSession.swift
      - path: KhmerIMEKeyboard/Input/KeyboardState.swift
      - path: KhmerIMEKeyboard/Input/SmartModePreference.swift
      - path: KhmerIMEKeyboard/Input/TextProxy.swift
      - path: KhmerIMEKeyboard/Controller/KeyboardResourceTeardown.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardChrome.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardHostLayout.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardLayerFactory.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardLayerVisibility.swift
      - path: KhmerIMEKeyboard/Layout/SwitchKeyVisibility.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardLayoutMetrics.swift
      - path: KhmerIMEKeyboard/Layout/KeyboardViewHierarchyBuilder.swift
      - path: KhmerIMEKeyboard/Layout/QwertyCharacterGridLayout.swift
      - path: KhmerIMEKeyboard/Views/CandidateRowLayout.swift
      - path: KhmerIMEKeyboard/Views/CandidateRowView.swift
      - path: KhmerIMEKeyboard/Views/CandidateSurfaceView.swift
      - path: KhmerIMEKeyboard/Views/PhraseWheelLayout.swift
      - path: KhmerIMEKeyboard/Views/PhraseWheelView.swift
      - path: KhmerIMEKeyboard/Views/GlassColorSpec.swift
      - path: KhmerIMEKeyboard/Views/GlassKeyPressAnimator.swift
      - path: KhmerIMEKeyboard/Views/GlassKeyView.swift
      - path: KhmerIMEKeyboard/Views/KeyboardRootView.swift
      - path: KhmerIMEKeyboard/Views/KeyStyle.swift
      - path: KhmerIMEKeyboard/Views/BackspaceButton.swift
      - path: KhmerIMEKeyboard/Views/GlobeKeyButton.swift
      - path: KhmerIMEKeyboard/Views/StripLabelPool.swift
      - path: KhmerIMEKeyboard/Views/StripPresentationSpec.swift
      - path: KhmerIMEKeyboard/Views/StripView.swift
      - path: KhmerIMEKeyboard/Generated/khmerime_ios_keyboard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIMEKeyboardTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - framework: Frameworks/KhmerIME.xcframework
        embed: false
