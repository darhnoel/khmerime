name: KhmerIME
options:
  bundleIdPrefix: com.khmerime
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Signing: use "-" for ad-hoc (no Apple account needed, simulator only).
    # For device builds, configure signing directly in Xcode (do not edit here).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:

  KhmerIME:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME
        INFOPLIST_FILE: KhmerIME/Info.plist
    dependencies:
      - target: KhmerIMEKeyboard
        embed: true

  KhmerIMEKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIMEKeyboard
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIME.Keyboard
        INFOPLIST_FILE: KhmerIMEKeyboard/Info.plist
    dependencies:
      - framework: Frameworks/KhmerIME.xcframework
        embed: false

  KhmerIMEKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KhmerIMEKeyboardTests
      # Share the handler + session source directly (no linking the extension bundle).
      - path: KhmerIMEKeyboard/KeyboardInputHandler.swift
      - path: KhmerIMEKeyboard/KeyboardState.swift
      - path: KhmerIMEKeyboard/KeyboardSession.swift
      - path: KhmerIMEKeyboard/TextProxy.swift
      - path: KhmerIMEKeyboard/Generated/khmerime_ios_keyboard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerime.KhmerIMEKeyboardTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - framework: Frameworks/KhmerIME.xcframework
        embed: false
